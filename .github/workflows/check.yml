name: Check

on:
   push:
   pull_request:

jobs:
   check:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22

         - name: Syntax check the JavaScript
           run: |
              find . -path ./.git -prune -o -type f \( -name "*.js" -o -name "*.mjs" \) -print | sort | while read -r file; do
                 node --check "$file" || exit 1
                 echo "ok $file"
              done

         - name: Lint the shell scripts
           run: |
              find . -path ./.git -prune -o -type f -name "*.sh" -print | sort | xargs shellcheck
              echo "shellcheck passed"

         - name: Validate the JSON
           run: |
              find . -path ./.git -prune -o -type f -name "*.json" -print | sort | while read -r file; do
                 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file" || exit 1
                 echo "ok $file"
              done
